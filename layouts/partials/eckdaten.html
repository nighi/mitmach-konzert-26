<div class="eckdaten">
  <div class="tuerchen" aria-hidden="true">
    <span class="tuerchen-tag">{{ site.Params.tag }}</span>
    <span class="tuerchen-monat">{{ site.Params.monat }}</span>
  </div>
  <dl>
    <div><dt>Wann</dt><dd>{{ site.Params.datum }}<br>{{ site.Params.uhrzeit }}{{ with site.Params.zusatz }}<span class="muted"> · {{ . }}</span>{{ end }}</dd></div>
    <div><dt>Wo</dt><dd><a href="{{ site.Params.ortLink }}" target="_blank" rel="noopener">{{ site.Params.ort }}</a></dd></div>
  </dl>
</div>
