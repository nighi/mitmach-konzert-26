# ============================================================
#  LIEDFOLGE – hier wird festgelegt, welche Lieder in welcher
#  Reihenfolge auf der Webseite (und in den ZIP-Downloads) stehen.
#
#  - Reihenfolge in dieser Datei = Reihenfolge auf der Webseite.
#    Zum Umsortieren einfach ganze [[lied]]-Blöcke verschieben.
#  - aktiv = false  → Lied wird ausgeblendet (Dateien bleiben liegen).
#  - datei          → Dateiname ohne Endung. Erwartet werden:
#                       static/noten/b/<datei>.pdf   (B-Stimme)
#                       static/noten/c/<datei>.pdf   (C-Stimme + Text)
#                       static/noten/es/<datei>.pdf  (Es-Stimme)
#                       static/noten/f/<datei>.pdf   (F-Stimme)
#                       static/audio/<datei>.mp3     (Hörbeispiel, optional)
#                     Fehlt eine Datei, steht dort „Noten folgen“.
#  - hinweis        → optionaler kleiner Zusatz unter dem Titel.
# ============================================================

